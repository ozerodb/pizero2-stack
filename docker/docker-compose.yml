# pizero2-stack / docker/docker-compose.yml
# ──────────────────────────────────────────────────────────────────────────────
# All sensitive values are loaded from docker/.env (git-ignored).
# This file is generated automatically by prepare_firstboot.py from firstboot.conf.
#
# Access model:
#   - Gatus and Ntfy web UIs: exposed via 'tailscale serve' over HTTPS.
#     No open firewall ports for web UIs.
# ──────────────────────────────────────────────────────────────────────────────
# Whole stack:
#   docker compose up -d
#   docker compose down
# Individual service:
#   docker compose start|stop|restart gatus
#   docker compose start|stop|restart ntfy
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Gatus ────────────────────────────────────────────────────────────────────
  # Go-based uptime monitor. Config file at ${CONFIG_ROOT}/gatus/config.yaml.
  # See docker/gatus.yaml.example for a starter config with Ntfy alerting.
  gatus:
    image: twinproduction/gatus:latest
    container_name: gatus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATUS_PORT:-8080}:8080"
    volumes:
      - ${CONFIG_ROOT}/gatus:/config
    environment:
      TZ: ${TZ:-Europe/Rome}
    security_opt:
      - no-new-privileges:true

  # ── Ntfy ─────────────────────────────────────────────────────────────────────
  # Lightweight push notification server. Access via 'tailscale serve'.
  # Users are provisioned automatically at startup via NTFY_AUTH_USERS (bcrypt hashes
  # generated by prepare_firstboot.py). Usernames are fixed: ntfyadmin (admin),
  # ntfypub (user, write-only — used by scripts to publish notifications).
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    restart: unless-stopped
    command: serve
    ports:
      - "127.0.0.1:${NTFY_PORT:-2586}:80"
    volumes:
      - ${CONFIG_ROOT}/ntfy/cache:/var/cache/ntfy
      - ${CONFIG_ROOT}/ntfy/data:/var/lib/ntfy
    environment:
      TZ: ${TZ:-Europe/Rome}
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_LOG_LEVEL: warn
      NTFY_BEHIND_PROXY: "true"
      NTFY_AUTH_USERS: "ntfyadmin:${NTFY_ADMIN_HASH}:admin,ntfypub:${NTFY_PUBLISH_HASH}:user"
      # NTFY_BASE_URL and NTFY_UPSTREAM_BASE_URL are intentionally omitted — ntfy rejects
      # empty strings. Set them here once you know your Tailscale hostname:
      #   NTFY_BASE_URL: "https://<pi-hostname>.<tailnet>.ts.net:2586"
      #   NTFY_UPSTREAM_BASE_URL: "https://ntfy.sh"
    security_opt:
      - no-new-privileges:true
